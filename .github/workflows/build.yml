# RunMeCpp —— 构建 + 端到端测试流水线（Windows / MSBuild）
#
# 为什么不用 CMake 多平台模板：
#   本项目是 Win32 C++ 程序（main.cpp 直接 include <windows.h> / <shellapi.h>），
#   只能在 Windows 上编译；ubuntu-latest 上的 gcc/clang 必然失败。
#   工程本身也是 MSBuild（RunMeCpp.sln / RunMeCpp.vcxproj），直接用 msbuild 即可。
name: Build & Test (Windows)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  # 供 release.yml 复用：发版前先跑同一套构建 + 测试
  workflow_call:
    inputs:
      configurations:
        description: '要构建的配置（JSON 数组）；发版只传 ["Release"]'
        required: false
        type: string
        default: '["Release","Debug"]'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} · ${{ matrix.configuration }}
    runs-on: windows-latest

    strategy:
      # 矩阵组合全部跑完再给结论，便于一次性看到各个配置的结果
      fail-fast: false
      matrix:
        # 平台名必须用解决方案里的 Win32（不是 x86），与 .sln 的解决方案平台一致
        platform: [ x64, Win32 ]
        # push/PR 默认 Release + Debug（Debug 只作编译/测试把关）；发版时 release.yml 只传 ["Release"]
        configuration: ${{ fromJSON(inputs.configurations || '["Release","Debug"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild RunMeCpp.sln /m /nologo /v:minimal
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}

      # x64 产物在 bin\<Config>\，Win32 产物在 bin\Win32\<Config>\（见 RunMeCpp.vcxproj 的 OutDir）
      - name: Locate output exe
        id: loc
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}' -eq 'Win32') {
            'bin/Win32/${{ matrix.configuration }}/RunMeCpp.exe'
          } else {
            'bin/${{ matrix.configuration }}/RunMeCpp.exe'
          }
          if (-not (Test-Path $exe)) { throw "build output not found: $exe" }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          Get-Item $exe | Select-Object FullName, Length

      # 两个脚本都以 exit <失败数> 结束，非零即让流水线变红。
      # 同时把 [FAIL] 行打成 annotation —— 这样在 PR / API 上不用翻日志就能看到是哪个用例挂了。
      - name: Test — smoke (29 cases)
        shell: pwsh
        run: |
          $log = & powershell -NoProfile -ExecutionPolicy Bypass -File docs\run-tests.ps1 -Exe '${{ steps.loc.outputs.exe }}' 2>&1
          $log | ForEach-Object { "$_" }
          $log | Where-Object { "$_".StartsWith('[FAIL]') } | ForEach-Object { "::error::$_" }
          if ($LASTEXITCODE -ne 0) { throw "run-tests.ps1 failed (exit $LASTEXITCODE)" }

      - name: Test — extended (6 cases)
        shell: pwsh
        run: |
          $log = & powershell -NoProfile -ExecutionPolicy Bypass -File docs\run-tests-extra.ps1 -Exe '${{ steps.loc.outputs.exe }}' 2>&1
          $log | ForEach-Object { "$_" }
          $log | Where-Object { "$_".StartsWith('[FAIL]') } | ForEach-Object { "::error::$_" }
          if ($LASTEXITCODE -ne 0) { throw "run-tests-extra.ps1 failed (exit $LASTEXITCODE)" }

      # 只上传 Release 产物：Debug 只用来把关编译与测试，exe 没有分发价值
      - name: Stage artifact
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item '${{ steps.loc.outputs.exe }}' 'dist/RunMeCpp-${{ matrix.platform }}-${{ matrix.configuration }}.exe'

      - name: Upload exe artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: RunMeCpp-${{ matrix.platform }}-${{ matrix.configuration }}
          path: dist/RunMeCpp-${{ matrix.platform }}-${{ matrix.configuration }}.exe
          if-no-files-found: error
